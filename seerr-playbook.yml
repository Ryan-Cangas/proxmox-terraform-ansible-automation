---
- name: Deploy and Configure Seerr Stack
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install required baseline packages
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker official apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }}
          stable
        state: present
        filename: docker

    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Seerr app directory
      ansible.builtin.file:
        path: /opt/seerr
        state: directory
        mode: "0755"

    - name: Create Seerr config directory with node non-root permissions (1000:1000)
      ansible.builtin.file:
        path: /opt/seerr/config
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    - name: Copy docker-compose file to container
      ansible.builtin.copy:
        src: files/seerr-compose.yml
        dest: /opt/seerr/docker-compose.yml
        mode: "0644"

    - name: Start Seerr stack via Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/seerr
      register: compose_result
      changed_when: >-
        'Started' in compose_result.stdout
        or 'Running' not in compose_result.stdout
